name: Generate Contribution Snake Game

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate Purple-Themed Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ahlawatansh
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#a855f7&color_dots=#ebedf0,#d8b4fe,#a855f7,#7c3aed,#5b21b6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#161b22,#3b0764,#7c3aed,#a855f7,#c084fc

      - name: Push Snake SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
